[versions]
agp = "8.13.0"
kotlin = "2.2.21"
compose-bom = "2025.06.00"
activity-compose = "1.10.1"
jna = "5.17.0"
coroutines = "1.10.2"
work = "2.10.1"
leakcanary = "2.14"
benchmark = "1.4.0"
test-junit = "1.2.1"
test-runner = "1.6.2"
test-rules = "1.6.1"
test-services = "1.5.0"
test-orchestrator = "1.5.1"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
# The generated core bindings turn async exports into suspend functions.
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# Checks mail in the background, even after the app is closed or the phone restarts.
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
# Debug builds only: finds what keeps a closed screen in memory.
leakcanary = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
# The baseline profile generator: starts the app on an emulator and records what runs.
benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
test-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
test-rules = { module = "androidx.test:rules", version.ref = "test-rules" }
# Keeps what a UI test films; Gradle copies it off the emulator.
test-storage = { module = "androidx.test.services:storage", version.ref = "test-services" }
test-services = { module = "androidx.test.services:test-services", version.ref = "test-services" }
test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "test-orchestrator" }
# The UI tests: they drive gestures on an emulator and step the animation clock frame by frame.
compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-test = { id = "com.android.test", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
