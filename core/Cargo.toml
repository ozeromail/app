[workspace]
resolver = "3"
members = ["domain", "app", "api", "api/bindgen", "adapters/store-sqlite", "adapters/mime", "adapters/imap", "adapters/smtp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
ozero-domain = { path = "domain" }
ozero-app = { path = "app" }
ozero-imap = { path = "adapters/imap" }
ozero-mime = { path = "adapters/mime" }
ozero-smtp = { path = "adapters/smtp" }
ozero-store-sqlite = { path = "adapters/store-sqlite" }
rustls-platform-verifier = "0.7"
uniffi = { version = "0.32", default-features = false }

[workspace.lints.rust]
# deny, not forbid: UniFFI-generated code allows itself unsafe; hand-written unsafe is still an error.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
overflow-checks = true
# Keep the symbol table: uniffi-bindgen reads UniFFI metadata from it. AGP strips the packaged .so.
strip = "debuginfo"
