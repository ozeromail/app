# cargo-deny: licenses, advisories, duplicates and sources.
# The app is closed source: only permissive licenses, plus file-level MPL-2.0 (UniFFI).

[graph]
all-features = true
# Platforms we ship to, plus the Linux and macOS machines that build and test.
targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies between our own unpublished crates are fine.
allow-wildcard-paths = true
skip = [
  { crate = "syn@2", reason = "UniFFI build-time macros still use syn 2" },
  { crate = "getrandom@0.2", reason = "ring still uses 0.2; 0.3 comes only from uniffi-bindgen's tempfile" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
