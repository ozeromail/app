# cargo-deny: licenses, advisories, duplicates and sources.
# The app is closed source: only permissive licenses, plus file-level MPL-2.0 (UniFFI).

[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Path dependencies between our own unpublished crates are fine.
allow-wildcard-paths = true
skip = [
  { crate = "syn@2", reason = "UniFFI build-time macros still use syn 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
