[package]
name = "ozero-imap"
description = "IMAP client on imap-codec."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ozero-domain.workspace = true
imap-codec = "=2.0.0-alpha.9"
# Same crate imap-types uses; it does not re-export the trait.
bounded-static = { version = "0.8", default-features = false }
# imap-codec needs nom's `alloc` but does not enable it.
nom = { version = "7", default-features = false, features = ["alloc"] }
# Already in the tree; the Android certificate recheck logs through it.
log = "0.4"
# Already in the tree through rustls; hashes a trusted server certificate.
ring = { version = "0.17", default-features = false }
rustls-platform-verifier.workspace = true
# Already in the tree through rustls; checks a certificate against its CA's revocation list.
rustls-webpki = { version = "0.103", default-features = false, features = ["alloc", "ring"] }
tokio = { version = "1.53", default-features = false, features = ["net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
tokio = { version = "1.53", default-features = false, features = ["rt", "macros"] }

[lints]
workspace = true
