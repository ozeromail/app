[package]
name = "ozero-smtp"
description = "SMTP submission client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ozero-domain.workspace = true
tokio = { version = "1.53", default-features = false, features = ["net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
tokio = { version = "1.53", default-features = false, features = ["rt", "macros"] }

[lints]
workspace = true
