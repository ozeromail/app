[package]
name = "ozero-api"
description = "Facade for the platforms: live queries, commands, events. The only crate exposed over UniFFI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ozero_api"
# cdylib for Android, staticlib for the iOS XCFramework, lib for tests.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
ozero-app.workspace = true
ozero-domain.workspace = true
ozero-imap.workspace = true
ozero-mime.workspace = true
ozero-store-sqlite.workspace = true
# Makes sure the runtime UniFFI polls async exports on has IO and timers; `sync` for locks.
tokio = { version = "1.53", default-features = false, features = ["rt", "net", "time", "sync"] }
uniffi = { workspace = true, features = ["tokio"] }

# Android's certificate verifier is set up from Kotlin through one JNI call.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
rustls-platform-verifier.workspace = true

[lints]
workspace = true
