name: android

on:
  pull_request:
    paths: ["android/**", "core/**", "i18n/**", "tools/gen-strings.py", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "core/**", "i18n/**", "tools/gen-strings.py", ".github/workflows/android.yml"]
    # A tag like v0.1.0 also builds the signed release.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Rust Android targets
        working-directory: core
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: gradle/actions/setup-gradle@v4
      # A fixed debug key lets each new APK install over the last one.
      - name: Use the shared debug key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE is not set; this APK will not install over earlier builds"
          fi
      - name: Build and lint
        working-directory: android
        # The release build checks that R8 keeps what the core bindings need; a tag builds it
        # signed below.
        env:
          RELEASE: ${{ !startsWith(github.ref, 'refs/tags/v') && ':app:assembleRelease' || '' }}
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./gradlew :app:assembleDebug :app:lintDebug $RELEASE
      - name: Show lint errors
        if: failure()
        working-directory: android
        # Annotations show where logs cannot be read.
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          for report in pathlib.Path("app/build").glob("**/lint-results-debug.xml"):
              for issue in ET.parse(report).getroot().iter("issue"):
                  if issue.get("severity") not in ("Error", "Fatal"):
                      continue
                  where = issue.find("location")
                  file = where.get("file", "") if where is not None else ""
                  line = where.get("line", "1") if where is not None else "1"
                  print(f"::error file={file},line={line}::{issue.get('id')}: {issue.get('message')}")
          PY
      - name: Build the signed release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$UPLOAD_KEYSTORE_PASSWORD" ] || [ -z "$UPLOAD_KEY_ALIAS" ] || [ -z "$UPLOAD_KEY_PASSWORD" ]; then
            echo "::error::Set all four ANDROID_UPLOAD_* secrets"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$UPLOAD_KEYSTORE"
          VERSION_NAME="${VERSION_NAME#v}" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" \
            ./gradlew :app:bundleRelease :app:assembleRelease
      - name: Upload the release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ozero-mail-${{ github.ref_name }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ozero-mail-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
