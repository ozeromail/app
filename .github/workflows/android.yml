name: android

on:
  pull_request:
    paths: ["android/**", "core/**", "i18n/**", "tools/gen-strings.py", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "core/**", "i18n/**", "tools/gen-strings.py", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Rust Android targets
        working-directory: core
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: gradle/actions/setup-gradle@v4
      # A fixed debug key lets each new APK install over the last one.
      - name: Use the shared debug key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE is not set; this APK will not install over earlier builds"
          fi
      - name: Build and lint
        working-directory: android
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./gradlew :app:assembleDebug :app:lintDebug
      - name: Upload debug APK
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ozero-mail-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          compression-level: 0
          retention-days: 14
