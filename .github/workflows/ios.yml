name: ios

# macOS minutes cost 10x and iOS waits until the Play release, so this runs only by hand.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: core and app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust iOS targets
        working-directory: core
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: tools/build-xcframework.sh
      - name: Build the app for the simulator
        # Compiler errors also become annotations, readable without the job log.
        run: |
          set -o pipefail
          xcodebuild build -project ios/OzeroMail.xcodeproj -target OzeroMail \
            -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || {
            grep -E "error:" build.log | sort -u | head -10 | sed 's/%/%25/g; s/^/::error::/'
            exit 1
          }
