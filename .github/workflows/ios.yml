name: ios

# macOS minutes cost 10x, so PRs run this only when the Swift API or iOS files change.
on:
  push:
    branches: [main]
    paths: ["core/**", "ios/**", "i18n/**", "tools/build-xcframework.sh", "tools/gen-strings.py", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["core/.cargo/**", "core/api/**", "ios/**", "tools/build-xcframework.sh", "tools/gen-strings.py", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces its run; every run on main finishes.
  group: ios-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: core and app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Use Xcode 26 or newer
        # Built with an older Xcode, the app runs without iOS 26's Liquid Glass.
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -version | grep -Eq '^Xcode (2[6-9]|[3-9][0-9])' || { echo "::error::Xcode 26 or newer is needed"; exit 1; }
      - name: Install Rust iOS targets
        working-directory: core
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: tools/build-xcframework.sh
      - name: Build the app for the simulator
        # Compiler errors also become annotations, readable without the job log.
        run: |
          set -o pipefail
          xcodebuild build -project ios/OzeroMail.xcodeproj -target OzeroMail \
            -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || {
            grep -E "error:" build.log | sort -u | head -10 | sed 's/%/%25/g; s/^/::error::/'
            exit 1
          }
