name: baseline profile

# Records a new baseline profile on an emulator and commits it to the branch it ran on.
# Run it by hand after big UI changes. Not on pull requests: its own commit would start it again.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baseline-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Rust Android targets
        working-directory: core
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          save-if: false
      - uses: gradle/actions/setup-gradle@v6
      # The emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate
        working-directory: android
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./gradlew :app:generateReleaseBaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Commit the profile
        run: |
          git config user.name "Khizri Makhmudov"
          git config user.email "khizrim@khizrim.ru"
          git add android/app/src/release/generated
          git diff --cached --quiet && exit 0
          git commit -m "perf(android): update the baseline profile"
          git push origin "HEAD:$BRANCH"
