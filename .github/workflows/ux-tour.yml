name: ux tour

# Stills of every screen on test mail, for a UX review. Runs on the tour branch only.
on:
  push:
    branches: [test/ux-tour, test/align-tour]

permissions:
  contents: write

concurrency:
  group: ux-tour
  cancel-in-progress: true

jobs:
  test:
    name: gestures on an emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install the Rust emulator target
        working-directory: core
        run: |
          rustup toolchain install
          rustup target add x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android-ui
          save-if: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Start the test mail server
        run: tools/ui-test-mail.sh && tools/ux-tour-mail.sh
      - name: Build the app and its tests
        working-directory: android
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pozero.abis=x86_64
      # The emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # A broken download of the system image fails the run before any test; the runner below
      # then finds it installed.
      - name: Install the emulator image
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          for try in 1 2 3; do
            "$sdkmanager" --install emulator "system-images;android-34;google_apis;x86_64" >/dev/null && exit 0
            echo "::warning::System image download failed (try $try)"
            sleep 10
          done
          exit 1
      - name: Run the UI tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          UI_TEST_MINUTES: 40
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          # The tests are about animations: they must run.
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: tools/android-ui-test.sh -Pandroid.testInstrumentationRunnerArguments.class=com.ozeromail.app.TourTest#a_inbox,com.ozeromail.app.TourTest#h_twoAccounts,com.ozeromail.app.TourSignInTest
      - name: Keep the films
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-films
          path: |
            android/ui-films
            android/app/build/reports/androidTests/connected
          if-no-files-found: warn
          retention-days: 14
      # Also on a branch of their own, ui-films/<branch>, where they can be read without a
      # download from Actions storage. Not for pull requests from forks: their token cannot push.
      - name: Put the films on a branch
        if: always()
        env:
          BRANCH: ui-films/${{ github.head_ref || github.ref_name }}
        run: |
          [ -d android/ui-films ] || exit 0
          cd android/ui-films
          git init -q -b films
          git config user.name "Khizri Makhmudov"
          git config user.email "khizrim@khizrim.ru"
          git add -A
          git commit -q -m "test(android): films of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "films:$BRANCH"
